# Nginx du VPS : /etc/nginx/sites-available/billet.bouticksen.com
# Le HTTPS (443) est ajouté ensuite par : sudo certbot --nginx -d billet.bouticksen.com
server {
    listen 80;
    listen [::]:80;
    server_name billet.bouticksen.com;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:1654;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
