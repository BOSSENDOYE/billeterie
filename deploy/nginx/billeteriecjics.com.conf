# Nginx du VPS : /etc/nginx/sites-available/billeteriecjics.com
# HTTPS : sudo certbot certonly --webroot -w /var/www/certbot -d billeteriecjics.com -d www.billeteriecjics.com
#         puis sudo certbot install --nginx --cert-name billeteriecjics.com --redirect
server {
    listen 80;
    listen [::]:80;
    server_name billeteriecjics.com www.billeteriecjics.com;

    client_max_body_size 5m;

    # Vérification Let's Encrypt (certbot certonly --webroot -w /var/www/certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:1654;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
