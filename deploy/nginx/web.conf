# Nginx du conteneur « web » : site React + relais vers le backend Django
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 5m;

    # Transmet l'en-tête posé par le Nginx du VPS (https) à Django
    set $forwarded_proto $http_x_forwarded_proto;
    if ($forwarded_proto = '') { set $forwarded_proto $scheme; }

    location ~ ^/(api|django-admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Fichiers statiques de l'admin Django (collectstatic)
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    # Fichiers générés par Vite (noms avec empreinte)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /musique/ {
        expires 7d;
    }

    # Application React (routes gérées côté navigateur)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
